name: Check Gita Lessons

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Validate Android icons
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            for (const n of [192, 512]) {
              const b = readFileSync("public/icons/gita-" + n + ".png");
              if (b.subarray(0,8).toString("hex") !== "89504e470d0a1a0a" || b.readUInt32BE(16) !== n || b.readUInt32BE(20) !== n) throw Error("Bad PNG: " + n);
              console.log(n + "px icon valid");
            }
          '
